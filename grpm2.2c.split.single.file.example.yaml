esphome:
  name: grpm2
  comment: "${device_type}: ${device_comment}"

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  variant: esp32c6
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: n
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: n
      CONFIG_OPENTHREAD_ENABLED: n
      CONFIG_ENABLE_WIFI_STATION: y
      CONFIG_USE_MINIMAL_MDNS: n

# Safe mode configuration is recommended with direct USB serial - boot loop prevention
safe_mode:

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "ptdJtILT54VHuCRwRhVhRj5XOyLFS3/dbmsKnC+6G74=" # Must be 32 characters long and unique to each device, generate with `esphome api generate_key`

ota:
  - platform: esphome
    password: ""
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "grpm2"
    password: ""
    ap_timeout: 15s

captive_portal:

# Flash write sanity check, prevents premature failure
preferences:
  flash_write_interval: 60s

web_server:
  port: 80
  version: 3

spi:
  clk_pin: 19
  miso_pin: 22
  mosi_pin: 20

substitutions:
  device_type: ESP32-C6-H4
  device_comment: Power Meter
  disp_name: grpm2
# Interval of how often the power is updated
  update_time: 15s

  phase_a_current_cal: '14200'
  phase_b_current_cal: '14200'
  phase_c_current_cal: '14200'
  phase_a_voltage_cal: '4200'
  phase_b_voltage_cal: '4200'
  phase_c_voltage_cal: '4200'

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ESP IP Address

sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Strength"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""

  - platform: atm90e32
    cs_pin: GPIO23
    id: chip1
    phase_a:
      voltage:
        name: ${disp_name} L1 Volts
        accuracy_decimals: 4
      current:
        name: ${disp_name} CT1 Amps
        id: "ct1Amps"
        accuracy_decimals: 4
      power:
        name: ${disp_name} CT1 Watts
        accuracy_decimals: 4
        id: "ct1Watts"
      peak_current:
        name: ${disp_name} CT1 Peak Amps
        accuracy_decimals: 4
        id: "ct1PeakAmps"
      phase_angle:
        name: ${disp_name} CT1 Phase Angle
        id: "ct1PhaseAngle"
        accuracy_decimals: 0
      harmonic_power:
        name: ${disp_name} CT1 Harmonic Power
        accuracy_decimals: 4
        id: "ct1HarmonPower"
      gain_voltage: ${phase_a_voltage_cal}
      gain_ct: ${phase_a_current_cal}
    phase_b:
      voltage:
        name: ${disp_name} L2 Volts
        accuracy_decimals: 4
      current:
        name: ${disp_name} CT2 Amps
        id: "ct2Amps"
        accuracy_decimals: 4
      power:
        name: ${disp_name} CT2 Watts
        accuracy_decimals: 4
        id: "ct2Watts"
      peak_current:
        name: ${disp_name} CT2 Peak Amps
        accuracy_decimals: 4
        id: "ct2PeakAmps"
      phase_angle:
        name: ${disp_name} CT2 Phase Angle
        id: "ct2PhaseAngle"
        accuracy_decimals: 0
      harmonic_power:
        name: ${disp_name} CT2 Harmonic Power
        accuracy_decimals: 4
        id: "ct2HarmonPower"
      gain_voltage: ${phase_b_voltage_cal}
      gain_ct: ${phase_b_current_cal}
    phase_c:
      voltage:
        name: ${disp_name} L3 Volts
        accuracy_decimals: 4
      current:
        name: ${disp_name} CT3 Amps
        id: "ct3Amps"
        accuracy_decimals: 4
      power:
        name: ${disp_name} CT3 Watts
        accuracy_decimals: 4
        id: "ct3Watts"
      peak_current:
        name: ${disp_name} CT3 Peak Amps
        accuracy_decimals: 4
        id: "ct3PeakAmps"
      phase_angle:
        name: ${disp_name} CT3 Phase Angle
        id: "ct3PhaseAngle"
        accuracy_decimals: 0
      harmonic_power:
        name: ${disp_name} CT3 Harmonic Power
        accuracy_decimals: 4
        id: "ct3HarmonPower"
      gain_voltage: ${phase_c_voltage_cal}
      gain_ct: ${phase_c_current_cal}
    enable_gain_calibration: True
    enable_offset_calibration: True
    frequency:
      name: ${disp_name} IC1 Freq
    line_frequency: 60Hz
    gain_pga: 2x
    chip_temperature:
      name: ${disp_name} IC1 Temperature
    update_interval: ${update_time}

  - platform: template
    name: ${disp_name} Total L1 + L2 Amps
    id: "totalAmps"
    lambda: return id(ct1Amps).state+id(ct2Amps).state;
    accuracy_decimals: 2
    unit_of_measurement: A
    update_interval: ${update_time}
    device_class: current
  - platform: template
    name: ${disp_name} Total L1 + L2 Watts
    id: "totalWatts"
    lambda: return id(ct1Watts).state+id(ct2Watts).state;
    accuracy_decimals: 0
    unit_of_measurement: W
    device_class: power
    update_interval: ${update_time}

  - platform: total_daily_energy
    name: ${disp_name} Total kWh
    power_id: totalWatts
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing

time:
  - platform: homeassistant
    id: homeassistant_time

switch:
  - platform: restart
    name: ${disp_name} Restart

button:
  - platform: atm90e32
    id: chip1
    run_gain_calibration:
      name: "Run IC1 Gain Calibration"
    clear_gain_calibration:
      name: "Clear Gain Calibration"
    run_offset_calibration:
      name: "Run Offset Calibration"
    clear_offset_calibration:
      name: "Clear IC1 Offset Calibration"
    run_power_offset_calibration:
      name: "Run Power Offset Calibration"
    clear_power_offset_calibration:
      name: "Clear Power Offset Calibration"
number:
  - platform: atm90e32
    id: chip1
    reference_voltage:
      phase_a:
        name: "IC1 Phase A Ref Voltage"
        mode: box
      phase_b:
        name: "IC1 Phase B Ref Voltage"
        mode: box
      phase_c:
        name: "IC1 Phase C Ref Voltage"
        mode: box
    reference_current:
      phase_a:
        name: "IC1 Phase A Ref Current"
        mode: box
      phase_b:
        name: "IC1 Phase B Ref Current"
        mode: box
      phase_c:
        name: "IC1 Phase C Ref Current"
        mode: box
